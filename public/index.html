<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover makes iOS Safari report env(safe-area-inset-*), so the tab bar can sit above the home indicator and toolbar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E5E8CE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CareBridge" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <title>CareBridge</title>
    <style id="expo-reset">
      /* --app-h is the real visible height, set from window.innerHeight below. 100vh/100dvh are wrong on iPhone:
         the home-screen web app counts the status bar in them, and Safari's floating toolbar covers their bottom. */
      html, body { height: 100%; height: var(--app-h, 100dvh); background: #E5E8CE; }
      /* iOS Safari inflates small text (e.g. 12px tab labels) unless told not to; inflated labels overflow their line box and get clipped. */
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body { overflow: hidden; margin: 0; -webkit-tap-highlight-color: rgba(120, 149, 117, 0.2); }
      #root { display: flex; height: 100%; flex: 1; }
      button, [role="button"], a { touch-action: manipulation; }
    </style>
    <script>
      (function () {
        var set = function () { document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px'); };
        set();
        window.addEventListener('resize', set);
        window.addEventListener('orientationchange', function () { setTimeout(set, 250); });
        if (window.visualViewport) window.visualViewport.addEventListener('resize', set);
      })();
    </script>
  </head>
  <body>
    <noscript>CareBridge needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
