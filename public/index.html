<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover makes iOS Safari report env(safe-area-inset-*), so the tab bar can sit above the home indicator and toolbar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E5E8CE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CareBridge" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>CareBridge</title>
    <style id="expo-reset">
      html, body { height: 100%; background: #E5E8CE; }
      /* iOS Safari inflates small text (e.g. 12px tab labels) unless told not to; inflated labels overflow their line box and get clipped. */
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      /* dvh tracks the visible viewport as Safari's toolbars show and hide. */
      @supports (height: 100dvh) { html, body { height: 100dvh; } }
      body { overflow: hidden; margin: 0; -webkit-tap-highlight-color: rgba(120, 149, 117, 0.2); }
      #root { display: flex; height: 100%; flex: 1; }
      button, [role="button"], a { touch-action: manipulation; }
    </style>
  </head>
  <body>
    <noscript>CareBridge needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
